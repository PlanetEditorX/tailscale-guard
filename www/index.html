<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailscale 看门狗</title>
<link rel="icon" type="image/png" href="favicon_guard.png?v=108-guard2">
<link rel="shortcut icon" type="image/png" href="favicon_guard.png?v=108-guard2">
<link rel="apple-touch-icon" href="favicon_guard.png?v=108-guard2">
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--txt:#e2e8f0;--muted:#94a3b8;--acc:#38bdf8;--green:#4ade80;--red:#f87171;--amber:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;padding:16px;max-width:900px;margin:0 auto}
h1{font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.off{background:var(--red)}
.dot.warn{background:var(--amber)}
/* 状态图标：内联 SVG，颜色随 on/off 状态切换 */
.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-3px}
.icon.on{color:var(--green)}   /* 在线：绿 */
.icon.off{color:var(--red)}    /* 离线：红 */
.icon.unk{color:var(--muted)}  /* 未知：灰 */
.icon-wrap{display:inline-flex;align-items:center;gap:6px;margin-left:6px}
.sent-name{display:flex;align-items:center;gap:8px}
/* 提高特异性，避免被 .stat span:first-child 的灰色覆盖 */
.icon-wrap .icon.on{color:var(--green)}
.icon-wrap .icon.off{color:var(--red)}
.icon-wrap .icon.unk{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;color:var(--muted);margin-bottom:12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.stat:last-child{border:0}
.stat span:first-child{color:var(--muted)}
.badge{padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600}
.badge.green{background:rgba(74,222,128,.15);color:var(--green)}
.badge.red{background:rgba(248,113,113,.15);color:var(--red)}
.badge.amber{background:rgba(251,191,36,.15);color:var(--amber)}
.badge.gray{background:rgba(148,163,184,.15);color:var(--muted)}
.sec-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-title h2{margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--muted);font-weight:600}
#log{background:#0b1120;border-radius:8px;padding:12px;font-family:"SF Mono",Consolas,monospace;font-size:12px;color:#7dd3fc;max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0b1120;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:14px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button{padding:8px 16px;border-radius:8px;border:0;font-size:13px;font-weight:600;cursor:pointer;color:#0f172a}
.btn-main{background:var(--acc)}
.btn-ok{background:var(--green);color:#06210f}
.btn-warn{background:var(--amber)}
.btn-stop{background:var(--red);color:#fff}
.btn-ghost{background:var(--border);color:var(--txt)}
button:disabled{opacity:.5;cursor:default}
.hint{font-size:11px;color:var(--muted);margin-top:2px}
.panel{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
/* 在线统计：改为更简洁的趋势图，默认显示最近7天 */
.chart-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.chart-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chart-toolbar label{margin:0;color:var(--muted);font-size:12px}
.chart-toolbar select{width:auto;min-width:128px;background:#111827;border:1px solid rgba(148,163,184,.16);color:var(--txt);padding:7px 10px;font-size:13px;border-radius:8px}
.chart-desc{font-size:12px;color:var(--muted)}
.chart-shell{position:relative;overflow:hidden;background:#24272d;border:1px solid rgba(148,163,184,.12);border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
#chart{width:100%;height:208px;display:block;background:transparent;touch-action:none}
.chart-meta{position:absolute;left:12px;top:10px;z-index:2;color:#b2bac5;font-size:12px;line-height:1.35;pointer-events:none;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.chart-tooltip{position:absolute;z-index:3;display:none;pointer-events:none;min-width:156px;padding:7px 9px;border-radius:7px;background:rgba(13,16,21,.94);border:1px solid rgba(148,163,184,.22);box-shadow:0 6px 18px rgba(0,0,0,.28);font-size:11px;line-height:1.55;color:#dce2ea;white-space:nowrap;transform:translate(-50%,-100%)}
.chart-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend-line{display:inline-block;width:18px;height:2px;border-radius:2px;margin-right:6px;vertical-align:3px}
.legend-line.blue{background:#3b82f6;box-shadow:0 0 5px rgba(59,130,246,.45)}
.legend-band{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:rgba(59,130,246,.18);border:1px solid rgba(59,130,246,.28)}
.muted{color:var(--muted)}
@media(max-width:520px){.grid,.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1><span id="phaseDot" class="dot off"></span> Tailscale 看门狗</h1>

<div class="card">
  <h2>运行状态</h2>
  <div class="grid">
    <div class="stat"><span>守护进程</span><span id="sPhase" class="badge gray">读取中</span></div>
    <div class="stat"><span>Tailscale <span class="icon-wrap"><span id="tsIcon" class="icon unk"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5.2-3.4 8.8-8 11-4.6-2.2-8-5.8-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg></span></span></span><span id="sTs" class="badge gray">未知</span></div>
    <div class="stat"><span>哨兵整体</span><span id="sSentinel" class="badge gray">-</span></div>
    <div class="stat"><span>生效时段</span><span id="sEff" class="badge gray">-</span></div>
    <div class="stat"><span>启动命中</span><span id="sStartHits">-</span></div>
    <div class="stat"><span>停止命中</span><span id="sStopHits">-</span></div>
    <div class="stat"><span>上次动作</span><span id="sAction" class="muted">-</span></div>
    <div class="stat"><span>上次探测</span><span id="sProvbe" class="muted">-</span></div>
  </div>
  <div class="panel">
    <table><thead><tr><th>哨兵设备</th><th>状态</th></tr></thead><tbody id="sList"><tr><td colspan="2" class="muted">加载中…</td></tr></tbody></table>
  </div>
  <div class="btns">
    <button class="btn-main" onclick="act('ts-start')">启动 Tailscale</button>
    <button class="btn-stop" onclick="act('ts-stop')">停止 Tailscale</button>
    <button class="btn-warn" onclick="act('restart')">重启守护</button>
    <button class="btn-ok" onclick="act('start')">启动守护</button>
    <button class="btn-stop" onclick="act('stop')">停止守护</button>
  </div>
</div>

<div class="card">
  <div class="sec-title"><h2>在线趋势</h2><button class="btn-ghost" style="font-size:12px;padding:4px 10px" onclick="loadHistory()">刷新</button></div>
  <div class="chart-toolbar">
    <div class="chart-controls">
      <label for="rangeSelect">统计周期</label>
      <select id="rangeSelect" onchange="setRange(Number(this.value))">
        <option value="86400">最近24小时</option>
        <option value="604800" selected>最近7天</option>
        <option value="2592000">最近30天</option>
        <option value="15552000">最近6个月</option>
        <option value="31536000">最近1年</option>
      </select>
    </div>
    <div class="chart-desc">蓝线表示哨兵在线数量，浅蓝背景表示 Tailscale 运行时段。</div>
  </div>
  <div class="chart-shell" id="chartShell">
    <div class="chart-meta" id="chartMeta">最近7天 · 峰值 --</div>
    <canvas id="chart"></canvas>
    <div class="chart-tooltip" id="chartTooltip"></div>
  </div>
  <div class="chart-legend">
    <span><span class="legend-line blue"></span>哨兵在线数</span>
    <span><span class="legend-band"></span>Tailscale 运行时段</span>
    <span class="muted">默认保留最近 1 个月统计记录</span>
    <button class="btn-warn" style="font-size:12px;padding:2px 10px;margin-left:auto" onclick="clearHistory()">清除统计</button>
  </div>
</div>

<div class="card">
  <div class="sec-title"><h2>实时日志</h2><button class="btn-ghost" style="font-size:12px;padding:4px 10px" onclick="fetchLog(true)">刷新</button></div>
  <div id="log">载入中…</div>
</div>

<div class="card">
  <h2>配置</h2>
  <label>哨兵设备（每行一个，IP 或 MAC）</label>
  <textarea id="SENTINELS" placeholder="192.168.1.20&#10;AA:BB:CC:DD:EE:FF"></textarea>
  <div class="row">
    <div><label>正常探测间隔（秒）</label><input id="NORMAL_INTERVAL" type="number" placeholder="600"></div>
    <div><label>离线重试间隔（秒）</label><input id="RETRY_INTERVAL" type="number" placeholder="180"></div>
    <div><label>启动重试次数</label><input id="START_THRESHOLD" type="number" placeholder="3"></div>
    <div><label>停止阈值（次）</label><input id="STOP_THRESHOLD" type="number" placeholder="1"></div>
  </div>
  <div class="row">
    <div><label>启动条件</label>
      <select id="START_CONDITION">
        <option value="all_offline">全部离线</option>
        <option value="any_offline">任一离线</option>
        <option value="all_online">全部在线</option>
        <option value="any_online">任一在线</option>
      </select></div>
    <div><label>停止条件</label>
      <select id="STOP_CONDITION">
        <option value="any_online">任一在线</option>
        <option value="all_online">全部在线</option>
        <option value="any_offline">任一离线</option>
        <option value="all_offline">全部离线</option>
      </select></div>
  </div>
  <div class="row">
    <div><label>生效时段</label>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <input id="EFF_START" type="time" value="00:00" style="width:110px">
        <span class="muted">→</span>
        <input id="EFF_END" type="time" value="23:59" style="width:110px">
      </div>
      <label style="display:flex;align-items:center;gap:6px;margin-top:6px;cursor:pointer;font-size:13px">
        <input id="EFF_ALLDAY" type="checkbox" checked style="width:auto"> <span>全天生效（忽略上面的时间）</span>
      </label>
    </div>
    <div><label>统计保留时间</label>
      <select id="HISTORY_KEEP">
        <option value="86400">最近 24 小时</option>
        <option value="604800">最近 7 天</option>
        <option value="2592000" selected>最近 30 天（默认）</option>
        <option value="15552000">最近 6 个月</option>
        <option value="31536000">最近 1 年</option>
      </select>
      <div class="hint">建议默认保留 1 个月，兼顾趋势查看与空间占用。</div></div>
    <div><label>LAN 网卡</label><input id="LAN_IFACE" placeholder="enp6s18"></div>
  </div>
  <div class="btns">
    <button class="btn-ok" onclick="saveConfig()">保存配置</button>
    <button class="btn-ghost" onclick="loadConfig()">重新加载</button>
  </div>
</div>
<script>
// ===== 工具函数 =====
const base="";
// GET 请求 JSON；失败时返回错误对象而非抛异常
async function gj(p){try{return await(await fetch(base+p)).json();}catch(e){return{error:e.message};}}
// POST 表单请求 JSON（用于保存配置与启停动作）
async function pj(p,b){try{return await(await fetch(base+p,{method:"POST",headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b})).json();}catch(e){return{error:e.message};}}
// 根据守护阶段与 Tailscale 状态决定徽标颜色与文案
function dot(phase,ts){
  if(!ts&&phase!=='idle'&&phase!=='retry'&&phase!=='active') return ['warn','未知'];
  let b='gray',t=phase||'-';
  if(phase==='idle'||phase==='active') b='green';     // 稳态：绿
  else if(phase==='retry') b='amber';                 // 复测中：黄
  else if(phase==='paused') b='amber';                // 时段外：黄
  return [b,t];
}
// 设置徽标元素的文本与样式类
function set(id,txt,cls){const e=document.getElementById(id);e.textContent=txt;e.className='badge '+cls;}

// ===== 状态面板 =====
async function loadState(){
  const s=await gj('api/state');
  if(s.error){document.getElementById('sPhase').textContent='错误';return;}
  const ph=s.phase||'idle';
  const [bc,tn]=dot(ph,s.tailscale);
  const pd=document.getElementById('phaseDot');pd.className='dot '+(bc==='green'?'on':bc==='amber'?'warn':'off');
  set('sPhase',tn,bc);
  const tsOn=s.tailscale==='running';
  set('sTs',tsOn?'运行中':'已停止',tsOn?'green':'red');
  // Tailscale 状态图标：运行=绿(盾+对号)，停止=红(盾+叉)，未知=灰
  const tsIcon=document.getElementById('tsIcon');
  tsIcon.className='icon '+(tsOn?'on':s.tailscale==='stopped'?'off':'unk');
  tsIcon.innerHTML=s.tailscale==='running'
    ?'<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5.2-3.4 8.8-8 11-4.6-2.2-8-5.8-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg>'
    :'<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5.2-3.4 8.8-8 11-4.6-2.2-8-5.8-8-11V5z"/><path d="M10 10l4 4m0-4l-4 4"/></svg>';
  set('sSentinel',s.any_online===1?'有设备在线':'全部离线',s.any_online===1?'green':'red');
  set('sEff',s.effective==='yes'?'生效中':'生效时段外',s.effective==='yes'?'green':'amber');
  document.getElementById('sStartHits').textContent=(s.start_hits??0);
  document.getElementById('sStopHits').textContent=(s.stop_hits??0);
  document.getElementById('sAction').textContent=s.last_action||'无';
  document.getElementById('sProvbe').textContent=s.last_probe||'-';
  // 哨兵设备列表：每台设备前带手机图标（在线=绿，离线=红）
  const list=document.getElementById('sList');
  if(s.sentinels&&s.sentinels.length){
    list.innerHTML=s.sentinels.map(x=>{
      const on=x.status==='online';
      return `<tr><td><span class="sent-name"><span class="icon ${on?'on':'off'}"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>${x.device}</span></td><td><span class="badge ${on?'green':'red'}">${on?'在线':'离线'}</span></td></tr>`;
    }).join('');
  }else{list.innerHTML='<tr><td colspan="2" class="muted">未配置哨兵</td></tr>';}
}

// ===== 日志面板 =====
async function fetchLog(scroll){
  const r=await gj('api/log?lines=200');
  const e=document.getElementById('log');e.textContent=r.log||'暂无日志';
  if(scroll)e.scrollTop=e.scrollHeight;   // 需要时滚动到底部
}

// ===== 配置面板 =====
async function loadConfig(){
  const c=await gj('api/config');
  if(c.error)return;
  // SENTINELS 在 textarea 中用换行分隔；其它字段原样填充
  document.getElementById('SENTINELS').value=(c.SENTINELS||'').split(',').filter(Boolean).join('\n');
  // EFFECTIVE_TIME 无独立输入框（由下方两个 time 选择器表示），跳过
  ['NORMAL_INTERVAL','RETRY_INTERVAL','START_THRESHOLD','STOP_THRESHOLD','LAN_IFACE'].forEach(k=>{const e=document.getElementById(k);if(e)e.value=c[k]||'';});
  document.getElementById('HISTORY_KEEP').value=c.HISTORY_KEEP||'2592000';
  document.getElementById('START_CONDITION').value=c.START_CONDITION||'all_offline';
  document.getElementById('STOP_CONDITION').value=c.STOP_CONDITION||'any_online';
  // 把 EFFECTIVE_TIME(HHMM-HHMM) 解析到两个 time 选择器；为空则勾选"全天"
  const eff=(c.EFFECTIVE_TIME||'').trim();
  if(!eff){ document.getElementById('EFF_ALLDAY').checked=true; }
  else{
    document.getElementById('EFF_ALLDAY').checked=false;
    const parts=eff.split('-');
    document.getElementById('EFF_START').value=(parts[0]||'00:00').replace(/(\d{2})(\d{2})/,'$1:$2');
    document.getElementById('EFF_END').value=(parts[1]||'23:59').replace(/(\d{2})(\d{2})/,'$1:$2');
  }
}
// 把时间选择器转换回配置格式；勾选"全天"时返回空串
function effToConfig(){
  if(document.getElementById('EFF_ALLDAY').checked) return '';
  const s=document.getElementById('EFF_START').value.replace(':','');
  const e=document.getElementById('EFF_END').value.replace(':','');
  return s+'-'+e;
}
// 收集表单提交到 /api/config，成功后重载状态
async function saveConfig(){
  const sent=document.getElementById('SENTINELS').value.split('\n').map(x=>x.trim()).filter(Boolean).join(',');
  const body=new URLSearchParams();
  body.set('SENTINELS',sent);
  ['NORMAL_INTERVAL','RETRY_INTERVAL','START_THRESHOLD','STOP_THRESHOLD','START_CONDITION','STOP_CONDITION','LAN_IFACE']
    .forEach(k=>body.set(k,document.getElementById(k).value.trim()));
  body.set('EFFECTIVE_TIME',effToConfig());
  const keep=document.getElementById('HISTORY_KEEP').value;
  body.set('HISTORY_KEEP',keep);
  const r=await pj('api/config',body.toString());
  if(r.ok)alert('已保存，守护进程已重载');else alert('保存失败:'+(r.error||'未知'));
  loadState();
}
// 手动启停动作（守护进程 / Tailscale）
async function act(a){const r=await pj('api/action','action='+a);if(!r.ok)alert('操作失败');loadState();setTimeout(loadState,1500);}

// ===== 在线统计趋势图 =====
// 数据来自 /api/history（时间戳,在线数,总数,Tailscale状态），按所选周期聚合后显示
const RANGE_PRESETS={
  86400:{label:'最近24小时',bucket:1800},
  604800:{label:'最近7天',bucket:7200},
  2592000:{label:'最近30天',bucket:21600},
  15552000:{label:'最近6个月',bucket:172800},
  31536000:{label:'最近1年',bucket:604800}
};
let chartRange=604800;   // 默认显示最近 7 天，更适合看趋势
let chartData=[];        // 当前绘制数据，供缩放和悬停提示复用

function rangeInfo(){
  return RANGE_PRESETS[chartRange]||RANGE_PRESETS[604800];
}

// 切换统计周期（由下拉框触发）
function setRange(secs){
  chartRange=secs;
  const sel=document.getElementById('rangeSelect');
  if(sel && Number(sel.value)!==secs) sel.value=String(secs);
  loadHistory();
}

function aggregateHistory(hist,rangeSecs){
  const cfg=RANGE_PRESETS[rangeSecs]||RANGE_PRESETS[604800];
  const bucket=cfg.bucket;
  if(!hist.length)return[];
  // 时间轴终点以数据自身最新时间戳为准（NAS 时钟），
  // 避免浏览器与 NAS 时钟不同步导致过滤错乱、切换周期无变化
  const endTs=hist.reduce((m,p)=>Math.max(m,Number(p.t)),0);
  const startTs=endTs-rangeSecs;
  const filtered=hist.filter(p=>Number(p.t)>=startTs).sort((a,b)=>a.t-b.t);
  if(!filtered.length)return [];
  const map=[];
  for(const p of filtered){
    const idx=Math.floor((Number(p.t)-startTs)/bucket);
    if(!map[idx]) map[idx]={samples:[], ts:false};
    map[idx].samples.push(p);
    if(p.ts) map[idx].ts=true;
  }
  const out=[];
  for(let i=0;i<map.length;i++){
    const cell=map[i];
    if(!cell || !cell.samples.length) continue;
    const last=cell.samples[cell.samples.length-1];
    out.push({
      t:startTs+i*bucket+bucket/2,
      online:Number(last.online)||0,
      total:Number(last.total)||0,
      ts:!!cell.ts
    });
  }
  return out;
}

// 拉取历史并重绘；长时间范围先按固定时间桶聚合，避免图面过密杂乱
async function loadHistory(){
  const h=await gj('api/history');
  const raw=(h.history||[]);
  chartData=aggregateHistory(raw,chartRange);
  drawChart(chartData);
}

// 清除在线统计历史
async function clearHistory(){
  if(!confirm('确定清除全部在线统计历史数据？'))return;
  const r=await pj('api/action','action=clear-history');
  if(r.ok)loadHistory();else alert('清除失败');
}

// 安全平滑曲线：使用二次贝塞尔中点法。
// 控制点始终来自真实数据点，曲线不会超过相邻数据的最小/最大值。
// 例如在线数 1 → 0 时，只会在 1 和 0 之间平滑下降，不会先冲到 1 以上。
function smoothPath(ctx,pts){
  if(!pts.length)return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  if(pts.length===1)return;
  for(let i=1;i<pts.length;i++){
    const prev=pts[i-1];
    const cur=pts[i];
    const midX=(prev.x+cur.x)/2;
    const midY=(prev.y+cur.y)/2;
    ctx.quadraticCurveTo(prev.x,prev.y,midX,midY);
    if(i===pts.length-1){
      ctx.quadraticCurveTo(cur.x,cur.y,cur.x,cur.y);
    }
  }
}

function drawChart(hist){
  const cv=document.getElementById('chart');
  const meta=document.getElementById('chartMeta');
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const W=Math.max(260,cv.clientWidth||600), H=208;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  const ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const P={l:14,r:14,t:28,b:18};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const info=rangeInfo();

  // 背景横向虚线网格
  ctx.save();
  ctx.strokeStyle='rgba(151,158,170,.16)';
  ctx.lineWidth=1;
  ctx.setLineDash([4,6]);
  for(let i=0;i<=3;i++){
    const gy=P.t+(ih/3)*i+0.5;
    ctx.beginPath();ctx.moveTo(P.l,gy);ctx.lineTo(W-P.r,gy);ctx.stroke();
  }
  ctx.restore();

  if(!hist.length){
    meta.textContent=`${info.label} · 峰值 --`;
    ctx.fillStyle='rgba(166,173,183,.72)';
    ctx.font='12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    ctx.textAlign='center';
    ctx.fillText('暂无统计数据',W/2,H/2+6);
    return;
  }

  // 数据跨度不足所选周期时提示（避免误以为切换周期无效）
  const spanSecs=(hist[hist.length-1].t-hist[0].t);
  if(spanSecs < chartRange*0.9){
    ctx.fillStyle='rgba(166,173,183,.72)';
    ctx.font='12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    ctx.textAlign='center';
    ctx.fillText(`数据跨度不足（仅约 ${Math.max(1,Math.round(spanSecs/3600))} 小时），长周期显示内容相同属正常`,W/2,P.t+ih/2+6);
  }

  const maxTotal=Math.max(1,...hist.map(p=>Number(p.total)||0));
  const maxOnline=Math.max(0,...hist.map(p=>Number(p.online)||0));
  const tMin=hist[0].t;
  const tMax=hist[hist.length-1].t;
  const xFor=(p,i)=>P.l+((tMax>tMin)?((p.t-tMin)/(tMax-tMin))*iw:(hist.length<=1?iw/2:i/(hist.length-1)*iw));
  const yFor=v=>P.t+ih-(Math.max(0,Math.min(maxTotal,v))/maxTotal*ih);
  const onlinePts=hist.map((p,i)=>({x:xFor(p,i),y:yFor(Number(p.online)||0)}));

  meta.textContent=`${info.label} · 峰值 ${maxOnline}/${maxTotal} 台`;

  // Tailscale 运行时段：改为浅蓝背景区块，减少与主趋势线互相干扰
  ctx.save();
  let segStart=null;
  const rectFor=(x1,x2)=>{
    const w=Math.max(3,x2-x1);
    ctx.fillStyle='rgba(59,130,246,.08)';
    ctx.fillRect(x1,P.t,w,ih);
    ctx.fillStyle='rgba(59,130,246,.16)';
    ctx.fillRect(x1,H-P.b-5,w,5);
  };
  for(let i=0;i<hist.length;i++){
    if(hist[i].ts && segStart===null) segStart=i;
    const isEnd=!hist[i].ts || i===hist.length-1;
    if(segStart!==null && isEnd){
      const endIdx=hist[i].ts?i:i-1;
      const x1=onlinePts[segStart].x;
      const x2=onlinePts[endIdx].x + (segStart===endIdx?8:0);
      rectFor(x1,x2);
      segStart=null;
    }
  }
  ctx.restore();

  // 曲线下方轻微渐变填充
  ctx.save();
  const areaPath=new Path2D();
  areaPath.moveTo(onlinePts[0].x,H-P.b);
  for(let i=0;i<onlinePts.length;i++){
    const p=onlinePts[i];
    if(i===0) areaPath.lineTo(p.x,p.y);
    else {
      const prev=onlinePts[i-1];
      const midX=(prev.x+p.x)/2;
      areaPath.quadraticCurveTo(prev.x,prev.y,midX,(prev.y+p.y)/2);
      if(i===onlinePts.length-1) areaPath.quadraticCurveTo(p.x,p.y,p.x,p.y);
    }
  }
  areaPath.lineTo(onlinePts[onlinePts.length-1].x,H-P.b);
  areaPath.closePath();
  const grad=ctx.createLinearGradient(0,P.t,0,H-P.b);
  grad.addColorStop(0,'rgba(59,130,246,.18)');
  grad.addColorStop(1,'rgba(59,130,246,0)');
  ctx.fillStyle=grad;
  ctx.fill(areaPath);
  ctx.restore();

  // 主趋势线：在线哨兵数
  ctx.save();
  smoothPath(ctx,onlinePts);
  ctx.strokeStyle='#3b82f6';
  ctx.lineWidth=2.2;
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.shadowColor='rgba(59,130,246,.24)';
  ctx.shadowBlur=5;
  ctx.stroke();
  ctx.restore();
}

// 悬停/触摸提示：展示当前聚合点信息
function setupChartTooltip(){
  const cv=document.getElementById('chart');
  const tip=document.getElementById('chartTooltip');
  const shell=document.getElementById('chartShell');
  const hide=()=>{tip.style.display='none';};
  const show=e=>{
    if(!chartData.length){hide();return;}
    const rect=cv.getBoundingClientRect();
    const clientX=e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX;
    const clientY=e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY;
    const px=Math.max(0,Math.min(rect.width,clientX-rect.left));
    const t0=chartData[0].t,t1=chartData[chartData.length-1].t;
    const target=t0+(t1-t0)*(px/Math.max(1,rect.width));
    let best=chartData[0],dist=Math.abs(best.t-target);
    for(let i=1;i<chartData.length;i++){
      const d=Math.abs(chartData[i].t-target);
      if(d<dist){best=chartData[i];dist=d;}else if(chartData[i].t>target)break;
    }
    const d=new Date(best.t*1000);
    const date=d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
    const time=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
    tip.innerHTML=`${date} ${time}<br>在线哨兵：${best.online}/${best.total} 台<br>Tailscale：${best.ts?'运行中':'未运行'}`;
    tip.style.display='block';
    const shellRect=shell.getBoundingClientRect();
    const localX=clientX-shellRect.left;
    const localY=clientY-shellRect.top;
    tip.style.left=Math.max(85,Math.min(shellRect.width-85,localX))+'px';
    tip.style.top=Math.max(68,localY-8)+'px';
  };
  cv.addEventListener('mousemove',show);
  cv.addEventListener('mouseleave',hide);
  cv.addEventListener('touchstart',show,{passive:true});
  cv.addEventListener('touchmove',show,{passive:true});
  cv.addEventListener('touchend',hide,{passive:true});
}

// ===== 初始化与定时刷新 =====
gj('api/sync');               // 打开页面：刷新 token + 校正应用中心状态
loadState();loadConfig();fetchLog(true);loadHistory();
setupChartTooltip();
if(window.ResizeObserver){new ResizeObserver(()=>{if(chartData)drawChart(chartData);}).observe(document.getElementById('chartShell'));}
else{window.addEventListener('resize',()=>drawChart(chartData));}
act('probe-now');         // 打开页面立即触发一次检测（需守护进程运行中）
setInterval(loadState,5000);          // 状态每 5 秒刷新
setInterval(()=>fetchLog(true),10000); // 日志每 10 秒刷新
setInterval(loadHistory,30000);        // 在线统计每 30 秒刷新
</script>
